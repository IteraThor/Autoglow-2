<!DOCTYPE html>
<html lang="en" data-theme="arena">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoGlow Tournament</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27none%27 stroke=%27%2314b8a6%27 stroke-width=%273%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%274%27 fill=%27%2314b8a6%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Arena: Barlow Condensed. Flap board: Oswald, JetBrains Mono. Poster: Anton, Archivo, Archivo Narrow. -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Narrow:wght@600;700&family=Archivo:wght@600;700;800&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700&family=JetBrains+Mono:wght@500;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/studio/tournament.css?v=4">
  <link rel="stylesheet" href="/studio/tournament-looks.css?v=2">
  <link rel="stylesheet" href="/studio/tournament-compat.css?v=1">
  <script>
    // Old TV browsers (before Chrome 84) ignore gap on flex layouts: tournament-compat.css spaces them with margins
    (function () {
      try {
        var d = document.createElement('div');
        d.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute';
        d.appendChild(document.createElement('div')); d.appendChild(document.createElement('div'));
        document.documentElement.appendChild(d);
        if (d.scrollHeight !== 1) document.documentElement.className += ' no-flex-gap';
        document.documentElement.removeChild(d);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- The screen is 192 x 108 rem; tournament.js sets the rem to the window, so it is drawn at the TV's own resolution -->
  <div class="stage" id="stage">
    <div class="fx" aria-hidden="true"><i></i><i></i></div>
    <div class="screen" id="screen"></div>
    <div class="tk" id="tk" hidden></div>
    <div class="offline" id="offline" hidden>Reconnecting…</div>
  </div>
  <div class="hint" id="hint">Double-click for fullscreen</div>
  <!-- One plain script built for old TV browsers (Chrome 56+); build-tv.sh makes it from tournament.js -->
  <script src="/studio/js/tournament.bundle.js?v=5"></script>
  <script>
    // If the script could not start, say so on the screen instead of a blank background
    setTimeout(function () {
      var sc = document.getElementById('screen');
      if (sc && !sc.firstChild) sc.innerHTML = '<div style="padding:4em 6em;font:600 3vw sans-serif;color:#fff;text-transform:none">This TV browser is too old for the dashboard.<br><small style="font-size:1.6vw;opacity:.7">' + (window.__err || 'The script did not start') + '</small></div>';
    }, 6000);
    window.addEventListener('error', function (e) { window.__err = e.message; });
  </script>
</body>
</html>
