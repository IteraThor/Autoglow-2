<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overlay preview</title>
  <!-- The Overlay page's preview (web/js/features/overlay.js): a stand-in for Autodarts' match page with
       a made-up tournament, and the Bridge's own match screen code (chrome_extension/match.js, served
       at /bridge/match.js) drawing on it, so the preview is what the boards show. The page sends the
       settings, the scene (intro, play, won) and the format; a click on a part is sent back. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { background: #01040b radial-gradient(ellipse 70% 60% at 20% 0%, #0d2a6b55, transparent 70%); color: #fafafa; font: 500 14px/1.35 Manrope, system-ui, sans-serif; }
    /* Like Autodarts: a screen-high column (the ticker makes it shorter) with main in it */
    .shell { height: 100vh; display: flex; flex-direction: column; }
    main { position: relative; flex: 1; min-height: 0; display: grid; }
    /* Landscape: cards beside the board */
    main { grid-template: 60px 84px 1fr 96px / 1fr minmax(0, 660px) 1fr; }
    .top { grid-area: 1 / 1 / 2 / 4; display: flex; align-items: center; gap: 10px; padding: 0 28px; }
    .top .leave { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .top .icons { margin-left: auto; display: flex; gap: 18px; opacity: .9; }
    .chips { display: flex; gap: 8px; }
    .pill { background: #292c33; border-radius: 999px; padding: 3px 12px; font-size: 13px; white-space: nowrap; }
    .throws { grid-area: 2 / 2; align-self: start; height: 70px; margin: 0 12px; display: flex; align-items: stretch; background: #1b1f29; border-radius: 16px; overflow: hidden; }
    .throws .drow { flex: 1; display: flex; justify-content: space-evenly; gap: 12px; padding: 0 24px; border-right: 1px solid #ffffff14; }
    .throws .d { flex: 1; display: grid; place-items: center; font: 700 36px Manrope; color: #fafafa; }
    .throws .d:empty::before { content: '➶'; color: #5b606b; font-size: 26px; }
    .throws .sum { width: 100px; display: grid; place-items: center; font: 800 38px Manrope; }
    .throws .bot { width: 68px; display: grid; place-items: center; background: #292c33; }
    .bcell { grid-area: 3 / 2; min-height: 0; container-type: size; display: grid; place-items: center; }
    .board { position: relative; width: min(100cqw, 100cqh); aspect-ratio: 1; border-radius: 50%; overflow: hidden; }
    .board > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .bar { grid-area: 4 / 2; align-self: center; margin: 0 24px; height: 66px; display: flex; align-items: center; gap: 10px; padding: 0 22px; background: #0d2a63; border-radius: 16px; }
    .bar button { height: 40px; min-width: 44px; border-radius: 10px; border: 1px solid #3b6fe0; background: none; color: #fff; font: 700 14px Manrope; }
    .bar button.fill { background: #0b55df; border-color: #0b55df; padding: 0 16px; }
    .bar .sp { flex: 1; }
    .side { grid-row: 2 / 5; display: flex; align-items: center; justify-content: center; padding: 0 32px; }
    .side.l { grid-column: 1; } .side.r { grid-column: 3; }
    .card { width: 100%; max-width: 400px; height: 266px; }
    .cbox { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 16px; background: #16181c; color: #b8bcc5; overflow: hidden; }
    .cbox.act { background: linear-gradient(to right bottom, #75148b, #da3954); color: #fafafa; }
    .who { display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; visibility: hidden; }
    .act .dot { visibility: visible; }
    .chip { display: flex; align-items: center; gap: 6px; background: #0a0c10; padding: 4px 14px 4px 4px; transform: skew(-12deg); }
    .chip .av { width: 34px; height: 34px; border-radius: 50%; background: #2a3550; transform: skew(12deg); }
    .chip span:last-child { font: 400 20px 'Bebas Neue', sans-serif; transform: skew(12deg); color: #fafafa; }
    .score { font: 800 112px/1 Manrope; height: 100px; display: flex; align-items: flex-start; overflow: hidden; letter-spacing: -.03em; }
    .avg { font-size: 22px; }
    /* Portrait: cards across the top, the board below */
    @media (orientation: portrait) {
      main { grid-template: 60px 250px 84px 1fr 104px / 1fr 1fr; }
      .top { grid-area: 1 / 1 / 2 / 3; }
      .chips .pill:not(.mid) { display: none; }
      .chips { position: absolute; left: 50%; transform: translateX(-50%); }
      .side { grid-row: 2; padding: 0; align-items: stretch; }
      .side.l { grid-column: 1; } .side.r { grid-column: 2; }
      .card { max-width: none; height: 100%; }
      .cbox { border-radius: 0; }
      .throws { grid-area: 3 / 1 / 4 / 3; justify-self: center; width: min(560px, 90%); margin-top: 12px; }
      .bcell { grid-area: 4 / 1 / 5 / 3; }
      .bar { grid-area: 5 / 1 / 6 / 3; justify-self: center; width: min(560px, 90%); margin: 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
  <main>
    <div class="top">
      <span class="leave">‹ Leave</span>
      <div class="chips"><span class="pill">501</span><span class="pill mid">First to 2 legs</span><span class="pill">SI-DO</span></div>
      <span class="icons">◉ 0 &nbsp; ▮▮▮ &nbsp; ⚙</span>
    </div>
    <div class="side l"><div class="card"><div class="cbox" id="c0"><div class="who"><div class="dot"></div><div class="chip"><span class="av"></span><span id="n0">ANNA</span></div></div><div class="score" id="s0">501</div><div class="avg">Leg <b id="a0">0.0</b> / Match <b>68.9</b></div><div>🎯 <b id="d0">0</b></div></div></div></div>
    <!-- Like Autodarts: three dart slots and the total (class "@container"), then the bot button -->
    <div class="throws"><div class="drow"><div class="@container d"></div><div class="@container d"></div><div class="@container d"></div></div><div class="@container sum" id="sum">0</div><div class="bot">🤖</div></div>
    <!-- Like Autodarts: four layers of 1000 × 1000 (segments, logo, numbers, hits) in a round box -->
    <div class="bcell"><div class="board" aria-hidden="true">
      <svg viewBox="0 0 1000 1000"><g transform="translate(500,500)" id="segs"></g></svg>
      <svg viewBox="0 0 1000 1000"><g transform="translate(500,500)"><text class="cls-2" y="-120" text-anchor="middle" font-size="34" font-weight="800" fill="#75777b" letter-spacing="6">AUTOGLOW</text></g></svg>
      <svg viewBox="0 0 1000 1000"><g transform="translate(500,500)" id="nums"></g></svg>
      <svg viewBox="0 0 1000 1000"><g transform="translate(500,500)" id="hits"></g></svg>
    </div></div>
    <div class="side r"><div class="card"><div class="cbox" id="c1"><div class="who"><div class="dot"></div><div class="chip"><span class="av"></span><span id="n1">DIRK</span></div></div><div class="score" id="s1">501</div><div class="avg">Leg <b id="a1">0.0</b> / Match <b>61.2</b></div><div>🎯 <b id="d1">0</b></div></div></div></div>
    <div class="bar"><button class="fill">☝</button><button>⚙</button><span class="sp"></span><button>↶</button><button class="fill">Next</button></div>
  </main>
  </div>
  <script>
    // A dartboard to look at, drawn like Autodarts' own (its radii, colours and number order)
    const ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
    const pt = (r, a) => `${(r * Math.sin(a)).toFixed(2)} ${(-r * Math.cos(a)).toFixed(2)}`;
    const ring = (r0, r1, a0, a1, fill, extra = '') => `<path d="M${pt(r0, a0)} L${pt(r1, a0)} A${r1} ${r1} 0 0 1 ${pt(r1, a1)} L${pt(r0, a1)} A${r0} ${r0} 0 0 0 ${pt(r0, a0)}Z" fill="${fill}" ${extra}/>`;
    (() => {
      let s = '<circle r="500" fill="#01040B"/>';
      for (let i = 0; i < 20; i++) {
        const a0 = (i - 0.5) * Math.PI / 10, a1 = (i + 0.5) * Math.PI / 10, odd = i % 2;
        const [one, two] = odd ? ['#EAD3C4', '#009856'] : ['#01040B', '#E72946'];
        const w = 'stroke="#8EA3C1" stroke-width="1.5"';
        s += ring(37.778, 215.556, a0, a1, one, w) + ring(215.556, 237.778, a0, a1, two, w) + ring(237.778, 355.556, a0, a1, one, w) + ring(355.556, 377.778, a0, a1, two, w);
      }
      s += '<circle r="37.778" fill="#009856" stroke="#8EA3C1" stroke-width="1.5"/><circle r="15.556" fill="#E72946" stroke="#8EA3C1" stroke-width="1.5"/>';
      document.getElementById('segs').innerHTML = s;
      document.getElementById('nums').innerHTML = `<path class="cls-10" fill="#060C1A" fill-rule="evenodd" d="M0 -500A500 500 0 1 1 0 500A500 500 0 1 1 0 -500ZM0 -390A390 390 0 1 0 0 390A390 390 0 1 0 0 -390Z"/>`
        + ORDER.map((n, i) => { const a = i * Math.PI / 10; return `<text class="cls-9" fill="#707071" x="${(442 * Math.sin(a)).toFixed(1)}" y="${(-442 * Math.cos(a) + 22).toFixed(1)}" text-anchor="middle" font-size="64" font-weight="700" font-family="Manrope">${n}</text>`; }).join('');
    })();
    /** The darts of the scene on the stand-in board: where they hit, and the segment lit */
    function hits(darts) {
      const at = { T20: [226, 0], 5: [300, -0.25], 1: [130, 0.32] };
      document.getElementById('hits').innerHTML = darts.map(d => {
        const [r, a] = at[d] || [0, 0];
        return `<circle cx="${(r * Math.sin(a)).toFixed(1)}" cy="${(-r * Math.cos(a)).toFixed(1)}" r="12" style="fill: blue; stroke: white; stroke-width: 4;"/>`;
      }).join('') + (darts[0] === 'T20' ? ring(215.556, 237.778, -Math.PI / 20, Math.PI / 20, 'rgba(255, 220, 0, 0.65)', 'class="dart-segment-blink"') : '');
    }
    window.autoglowPreview = true;
  </script>
  <script src="/bridge/i18n.js"></script>
  <script src="/bridge/match.js"></script>
  <script>
    // A made-up tournament: eight players, the quarter-finals played, this board on a semi-final
    const P = [['P1', 'Anna', 1], ['P2', 'Ben', 5], ['P3', 'Carla', 3], ['P4', 'Dirk', 4], ['P5', 'Eva', 8], ['P6', 'Finn', 6], ['P7', 'Greta', 7], ['P8', 'Hugo', 2]]
      .map(([id, name, seed]) => ({ id, name, seed }));
    const done = (id, a, b, legs, avg, t180, seq, label = 'Quarter-final') => ({ id, label, stage: 'ko', state: 'done', done_seq: seq, legs_to_win: 2,
      sides: [{ player: a }, { player: b }], result: { winner: legs[0] > legs[1] ? 0 : 1, legs, stats: { average: avg, '180s': t180 } } });
    function tournament(format, scene) {
      const groups = format === 'groups';
      const m = groups
        ? { id: 'M9', label: 'Group A · Round 3', stage: 'group', group: 'A', state: scene === 'won' ? 'done' : 'live', board: 'me', legs_to_win: 2, sides: [{ player: 'P1' }, { player: 'P4' }] }
        : { id: 'M5', label: 'Semi-final', stage: 'ko', state: scene === 'won' ? 'done' : 'live', board: 'me', legs_to_win: 2, sides: [{ player: 'P1', from: 'W:M1' }, { player: 'P4', from: 'W:M2' }] };
      if (scene === 'won') m.result = { winner: 0, legs: [2, 1], stats: { average: [71.4, 64.2], '180s': [1, 0] } };
      const matches = groups ? [
        { ...done('M1', 'P1', 'P5', [2, 0], [68.2, 51.0], [0, 0], 1, 'Group A · Round 1'), stage: 'group', group: 'A' },
        { ...done('M2', 'P4', 'P8', [2, 1], [60.5, 58.9], [1, 0], 2, 'Group A · Round 1'), stage: 'group', group: 'A' },
        { ...done('M5', 'P1', 'P8', [1, 2], [62.0, 66.4], [0, 1], 5, 'Group A · Round 2'), stage: 'group', group: 'A' },
        { ...done('M6', 'P4', 'P5', [2, 0], [63.3, 49.7], [0, 0], 6, 'Group A · Round 2'), stage: 'group', group: 'A' },
        m,
        { id: 'M10', label: 'Group A · Round 3', stage: 'group', group: 'A', state: 'live', board: 'b2', sides: [{ player: 'P8' }, { player: 'P5' }] },
        { id: 'M11', label: 'Group B · Round 3', stage: 'group', group: 'B', state: 'ready', sides: [{ player: 'P3' }, { player: 'P2' }] }
      ] : [
        done('M1', 'P1', 'P5', [2, 0], [68.2, 51.0], [0, 0], 1),
        done('M2', 'P4', 'P6', [2, 1], [60.5, 58.9], [1, 0], 2),
        done('M3', 'P3', 'P7', [2, 1], [64.0, 59.6], [0, 1], 3),
        done('M4', 'P8', 'P2', [0, 2], [55.1, 63.8], [0, 0], 4),
        m,
        { id: 'M6', label: 'Semi-final', stage: 'ko', state: 'live', board: 'b2', sides: [{ player: 'P3', from: 'W:M3' }, { player: 'P2', from: 'W:M4' }] },
        { id: 'M7', label: 'Final', stage: 'ko', state: 'pending', sides: [{ from: 'W:M5' }, { from: 'W:M6' }] }
      ];
      const tables = groups ? [{ name: 'A', rows: [
        { player: 'P8', name: 'Hugo', won: 2, lost: 1, legs_for: 5, legs_against: 3 },
        { player: 'P1', name: 'Anna', won: 1, lost: 1, legs_for: 3, legs_against: 2 },
        { player: 'P4', name: 'Dirk', won: 2, lost: 0, legs_for: 4, legs_against: 1 },
        { player: 'P5', name: 'Eva', won: 0, lost: 3, legs_for: 0, legs_against: 6 }] }] : [];
      return { id: 'preview', name: 'Friday Cup', format: groups ? 'groups' : 'single_ko', status: 'running', players: P, matches, tables,
        boards: [{ node_id: 'me', number: 1 }, { node_id: 'b2', number: 2, status: { match: groups ? 'M10' : 'M6', live: { legs: [1, 1] } } }],
        up_next: groups ? ['M11'] : [] };
    }
    const LIVE = { intro: { legs: [0, 0], active: 0, remaining: [501, 501] }, play: { legs: [1, 0], active: 0, remaining: [96, 301], darts: ['T20'] }, won: { legs: [2, 1], active: null, remaining: [0, 86] } };
    let state = { overlay: null, scene: 'play', format: 'ko' };
    function apply(intro) {
      if (!state.overlay) return;
      const t = tournament(state.format, state.scene);
      const live = LIVE[state.scene];
      const m = t.matches.find(x => x.board === 'me');
      // The stand-in Autodarts cards follow the scene
      [0, 1].forEach(i => {
        document.getElementById(`c${i}`).classList.toggle('act', live.active === i);
        document.getElementById(`s${i}`).textContent = live.remaining[i];
        document.getElementById(`a${i}`).textContent = live.active === null ? '0.0' : ['71.4', '64.2'][i];
      });
      const darts = live.darts || [];
      document.querySelectorAll('.throws .d').forEach((d, i) => { d.textContent = darts[i] || ''; });
      document.getElementById('sum').textContent = String(darts.reduce((n, d) => n + ({ T20: 60, 5: 5, 1: 1 }[d] || 0), 0));
      hits(darts);
      const board = { assignment: { match: m.id, players: [{ id: 'P1', name: 'Anna', ad_name: 'ANNA' }, { id: 'P4', name: 'Dirk', ad_name: 'DIRK' }], settings: { base_score: 501, legs: 2, sets: 0 } }, linked: 'preview', live };
      if (state.scene === 'won') board.assignment = { match: state.format === 'groups' ? 'M12' : 'M7', players: [{ id: 'P1', name: 'Anna' }, { id: 'P8', name: 'Hugo' }], settings: { base_score: 501, legs: 2, sets: 0 } };
      // The winner banner reads the result from the tournament; the live score stays with the match
      // After the result the board is no longer linked to the match and has its next one
      const data = { tournament: t, node: { id: 'me' }, board: state.scene === 'won' ? { assignment: board.assignment, linked: null, live: null } : board, overlay: state.overlay };
      if (state.scene === 'won') {
        // Keep the match on this page after its result: the first call links it, the second shows the result
        window.autoglowMatch({ ...data, tournament: tournament(state.format, 'play'), board: { assignment: { match: m.id, players: [{ id: 'P1', name: 'Anna', ad_name: 'ANNA' }, { id: 'P4', name: 'Dirk', ad_name: 'DIRK' }], settings: { base_score: 501, legs: 2, sets: 0 } }, linked: 'preview', live } });
      }
      window.autoglowMatch(data, { intro });
    }
    addEventListener('message', ({ data, origin }) => {
      if (origin !== location.origin || !data || data.type !== 'ag-preview') return;
      const replay = data.scene === 'intro' && (data.replay || state.scene !== 'intro');
      state = { overlay: data.overlay, scene: data.scene, format: data.format };
      apply(replay);
      // The Overlay page's list picked a part; the alignment grid
      if ('select' in data) window.autoglowSelect(data.select && data.select.key, data.select && data.select.part);
      window.autoglowGrid(data.grid);
      // The Overlay page shows a moment: 180, bust, the leg's last dart
      if (data.moment && window.autoglowMoment) window.autoglowMoment(data.moment);
    });
    parent.postMessage({ type: 'ag-ready' }, location.origin);
  </script>
</body>
</html>
