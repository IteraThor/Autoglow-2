<!DOCTYPE html>
<html lang="en" data-theme="autodarts">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoGlow Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27none%27 stroke=%27%2314b8a6%27 stroke-width=%273%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%274%27 fill=%27%2314b8a6%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Barlow:wght@500;600;700&family=Oswald:wght@500;600;700&family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;700;800&family=Saira+Condensed:wght@600;700;800&family=Outfit:wght@200;300;400;500;600;700&family=Kalam:wght@400;700&family=Cabin+Sketch:wght@400;700&family=Archivo:wght@500;600;700;800&family=Archivo+Narrow:wght@600;700&family=Inter+Tight:wght@200;300;400;500;600&family=DM+Serif+Display:ital@0;1&family=Libre+Franklin:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=Archivo+Black&family=Space+Grotesk:wght@500;600;700&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/studio/live.css?v=7">
  <link rel="stylesheet" href="/studio/looks.css?v=5">
  <link rel="stylesheet" href="/studio/live-compat.css?v=2">
  <script>
    // Old TV browsers (before Chrome 84) ignore gap on flex layouts: live-compat.css spaces them with margins
    window.addEventListener('error', function (e) { window.__err = e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''); });
    (function () {
      try {
        var d = document.createElement('div');
        d.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute';
        d.appendChild(document.createElement('div')); d.appendChild(document.createElement('div'));
        document.documentElement.appendChild(d);
        if (d.scrollHeight !== 1) document.documentElement.className += ' no-flex-gap';
        document.documentElement.removeChild(d);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Everything is laid out on a 1920x1080 stage that js/main.js scales to the window -->
  <div class="stage" id="stage">
    <!-- Idle background: the board camera drawn tiny and stretched (soft blur) -->
    <canvas class="bg-blur" id="blur" width="160" height="90"></canvas>
    <div class="bg-shade"></div>

    <div class="cams" id="cams" data-layout="split">
      <div class="cam" id="camBoard"></div>
      <div class="cam" id="camPlayer"></div>
      <div class="cam-divider"></div>
    </div>

    <!-- Live overlays -->
    <div class="live-layer">
      <div class="player-card" id="playerCard" hidden></div>
      <div class="dock">
        <div class="visit" id="visit" hidden></div>
        <div class="board" id="scoreboard">
          <div class="board-head">
            <span class="board-target" id="boardTarget"></span>
            <span class="board-col sets" id="boardSetsLabel"></span>
            <span class="board-col" id="boardLegsLabel"></span>
            <span class="board-col"></span>
          </div>
          <div class="board-rows" id="boardRows"></div>
          <div class="board-title" id="boardTitle"></div>
        </div>
      </div>
      <div class="mini-board" id="miniBoard" hidden></div>
    </div>

    <!-- Idle: logo, clock, rotating slides -->
    <div class="idle-layer">
      <div class="idle-top">
        <div class="logo brand"><b></b> <span></span></div>
        <div class="idle-clock" id="idleClock"></div>
      </div>
      <div class="idle-slides" id="idleSlides"></div>
      <div class="idle-status" id="idleStatus"></div>
    </div>

    <!-- Bull-off before the first leg: rule, darts, zoomed bull target (js/bulloff.js) -->
    <div class="bull-off" id="bullOff"></div>

    <div class="intro" id="intro" hidden></div>
    <div class="leg-card" id="legCard" hidden></div>
    <div class="match-card" id="matchCard" hidden></div>

    <div class="bug brand"><b></b><span></span></div>
    <div class="moment" id="moment" hidden></div>

    <div class="stinger" id="stinger">
      <i class="s1"></i><i class="s2"></i><i class="s3"></i>
      <div class="st-logo brand"><b></b> <span></span></div>
    </div>
  </div>

  <div class="hint" id="hint">Double-click for fullscreen</div>
  <!-- One plain script built for old TV browsers (Chrome 56+); build-tv.sh makes it from js/main.js -->
  <script src="/studio/js/main.bundle.js?v=1"></script>
  <script>
    // If the script did not start, say so on the screen instead of a blank background
    setTimeout(function () {
      if (window.__started) return;
      var v = /Chrom(?:e|ium)\/(\d+)/.exec(navigator.userAgent), d = document.createElement('div');
      d.style.cssText = 'position:fixed;left:0;right:0;top:0;padding:2em 3em;font:600 28px sans-serif;color:#fff;background:#b91c1c;z-index:99;text-transform:none';
      d.innerHTML = 'The Studio did not start on this TV.<br><small style="font-size:18px;font-weight:500">Browser: Chrome ' + (v ? v[1] : '?') + ' · script started: ' + (window.__started ? 'yes' : 'no') + ' · ' + (window.__err || 'no error reported') + '</small>';
      document.body.appendChild(d);
    }, 10000);
  </script>
</body>
</html>
