<!DOCTYPE html>
<html lang="en" data-theme="autodarts">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoGlow Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27none%27 stroke=%27%2314b8a6%27 stroke-width=%273%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%274%27 fill=%27%2314b8a6%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Barlow:wght@500;600;700&family=Oswald:wght@500;600;700&family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;700;800&family=Saira+Condensed:wght@600;700;800&family=Outfit:wght@200;300;400;500;600&family=Kalam:wght@400;700&family=Cabin+Sketch:wght@400;700&family=Archivo:wght@500;600;700;800&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/studio/live.css?v=5">
  <link rel="stylesheet" href="/studio/looks.css?v=2">
</head>
<body>
  <!-- Everything is laid out on a 1920x1080 stage that js/main.js scales to the window -->
  <div class="stage" id="stage">
    <!-- Idle background: the board camera drawn tiny and stretched (soft blur) -->
    <canvas class="bg-blur" id="blur" width="160" height="90"></canvas>
    <div class="bg-shade"></div>

    <div class="cams" id="cams" data-layout="split">
      <div class="cam" id="camBoard"></div>
      <div class="cam" id="camPlayer"></div>
      <div class="cam-divider"></div>
    </div>

    <!-- Live overlays -->
    <div class="live-layer">
      <div class="player-card" id="playerCard" hidden></div>
      <div class="dock">
        <div class="visit" id="visit" hidden></div>
        <div class="board" id="scoreboard">
          <div class="board-head">
            <span class="board-target" id="boardTarget"></span>
            <span class="board-col sets" id="boardSetsLabel"></span>
            <span class="board-col" id="boardLegsLabel"></span>
            <span class="board-col"></span>
          </div>
          <div class="board-rows" id="boardRows"></div>
          <div class="board-title" id="boardTitle"></div>
        </div>
      </div>
      <div class="mini-board" id="miniBoard" hidden></div>
    </div>

    <!-- Idle: logo, clock, rotating slides -->
    <div class="idle-layer">
      <div class="idle-top">
        <div class="logo brand"><b></b> <span></span></div>
        <div class="idle-clock" id="idleClock"></div>
      </div>
      <div class="idle-slides" id="idleSlides"></div>
      <div class="idle-status" id="idleStatus"></div>
    </div>

    <!-- Bull-off before the first leg: rule, darts, zoomed bull target (js/bulloff.js) -->
    <div class="bull-off" id="bullOff"></div>

    <div class="intro" id="intro" hidden></div>
    <div class="leg-card" id="legCard" hidden></div>
    <div class="match-card" id="matchCard" hidden></div>

    <div class="bug brand"><b></b><span></span></div>
    <div class="moment" id="moment" hidden></div>

    <div class="stinger" id="stinger">
      <i class="s1"></i><i class="s2"></i><i class="s3"></i>
      <div class="st-logo brand"><b></b> <span></span></div>
    </div>
  </div>

  <div class="hint" id="hint">Double-click for fullscreen</div>
  <script type="module" src="/studio/js/main.js?v=3"></script>
</body>
</html>
