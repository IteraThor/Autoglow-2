[project]
name = "autoglow"
dynamic = ["version"]
description = "Real-time WLED lighting orchestration for Autodarts boards"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 160
extend-exclude = ["venv", ".venv", "backups", "scratch"]

[tool.ruff.lint]
# Pyflakes + syntax errors: catches undefined names, unused imports/variables, broken f-strings
select = ["E9", "F"]
